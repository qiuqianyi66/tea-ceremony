spring:
  application:
    name: tea-backend
  # 排除 openai starter 的 embedding/音频/图像/审核自动配置（2026-10-12 评测通道引入 openai starter 后实测）：
  # ①openAiEmbeddingModel 与 dashscope 双装配 → @MockBean/ObjectProvider 歧义；
  # ②audio/image/moderation 工厂方法无 key 即启动失败（测试环境无 openai key 全炸）。
  # 评测只需 openai chat（网关仅 /v1/chat/completions），其余模态一律排除，零损失。
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  # T11 AI（DashScope）：默认占位 disabled，防 starter 无 key 自动配置启动失败
  # （DashScopeAgentAutoConfiguration 强制 key）；AiChatService 检测 disabled/空 → 502 触发前端降级；
  # 生产经环境变量 AI_DASHSCOPE_API_KEY 注入真实 key（官方约定变量名）
  ai:
    model:
      # 默认 ChatModel 固定 dashscope（@Primary），消除 openai starter 引入后的双 ChatModel 歧义：
      # 生产/测试语义不变；评测经 gateway profile 覆盖为 openai（application-gateway.yml）
      chat: dashscope
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY:disabled}
      # 百炼工作空间专属 endpoint（sk-ws- key 必须配专属 base-url；根地址即可，completionsPath 自带 /api/v1）
      base-url: ${AI_DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com}
      # Phase 2 知识注入（T05）：embedding 模型对齐 V3 culture_chunks.embedding vector(1024)
      # （text-embedding-v3 默认 1024 维；无 key 时 starter 不提供 EmbeddingModel bean，回填自动降级 pending）
      embedding:
        options:
          model: ${AI_EMBEDDING_MODEL:text-embedding-v3}
    # P1-1 MCP server：ToolCallbackProvider 注册的 @Tool（culture-search）经 SSE WebMVC transport 暴露，
    # 外部 agent（Claude Code/Codex/Goose 等）可经标准 MCP 协议调用（SSE 端点 /mcp，消息端点 /mcp/messages）
    mcp:
      server:
        name: tea-mcp-server
        version: 1.0.0
        type: SYNC
        capabilities:
          tool: true
        sse-endpoint: /mcp
        sse-message-endpoint: /mcp/messages
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tea}
    username: ${DB_USER:tea}
    password: ${DB_PASSWORD:tea}
  jpa:
    hibernate:
      # 红线 #7：禁 ddl-auto: update；validate 仅校验 Entity 与迁移一致，schema 变更只走 Flyway
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}

tea:
  jwt:
    # 2026-10-12 安全审计 H2：主配置不再带公开兜底密钥——未注入 JWT_SECRET 时启动即失败
    # （JwtService 校验 <32 字节抛异常），防止裸 java -jar 部署误用公开已知密钥导致 JWT 可伪造。
    # dev  profile 的本地开发兜底见 application-dev.yml；docker-compose 已用 ${JWT_SECRET:?} 强制注入。
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  # 2026-10-12 安全审计 H1：管理端点（/api/v1/admin/**）独立访问令牌；未配置时管理端点 fail-closed（401）
  admin:
    token: ${ADMIN_API_TOKEN:}
  ratelimit:
    # 批 3 安全审计：AI/登录公开端点限流（滑动窗口，进程内存；环境变量沿用旧栈 RATE_LIMIT_* 名称）
    ai-max: ${RATE_LIMIT_AI_MAX:10}
    ai-window-ms: ${RATE_LIMIT_AI_WINDOW_MS:60000}
    login-max: ${RATE_LIMIT_LOGIN_MAX:10}
    login-window-ms: ${RATE_LIMIT_LOGIN_WINDOW_MS:300000}
  ai:
    complexity:
      # T09 复杂度路由阈值（SIMPLE=短问短轮直答 / COMPLEX=长问多轮压缩；MEDIUM 居中）
      simple-max-words: ${AI_COMPLEXITY_SIMPLE_MAX_WORDS:40}
      simple-max-turns: ${AI_COMPLEXITY_SIMPLE_MAX_TURNS:3}
      complex-min-words: ${AI_COMPLEXITY_COMPLEX_MIN_WORDS:200}
    # F-6 会话配额（ADR-018）：单会话内 LLM 调用上限；0/负数=不限。
    # 与 tea.ratelimit.ai-max（10/min 瞬时速率）是两层：限流管速率，配额管会话总量。
    max-calls-per-session: ${AI_MAX_CALLS_PER_SESSION:10}

garden:
  energy:
    rules:
      brew-base: 5          # 每次冲泡基础能量（D2 配置化，ADR-015）
      note-per-100: 10      # 笔记每 100 字能量
    phases:                 # 阶段阈值（D4 已确认），只升不降推进
      planted: 0
      growing: 100
      blooming: 300
      harvested: 600

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
