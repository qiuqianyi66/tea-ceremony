# 评测/测试专用 profile：经 OpenAI 兼容网关（yg-gateway）调用模型，不触碰生产 DashScope 主路径。
# 激活方式：SPRING_PROFILES_ACTIVE=gateway + 环境变量（见 docker-compose.eval.yml）。
# 设计要点：
#  - spring.ai.model.chat=openai：openai 成为默认 ChatModel（dashscope 在无 key 时不装配，天然无 bean 冲突）；
#  - 生产不激活本 profile，openai api-key 未配置即不装配，dashscope 承重墙不变；
#  - 网关为 passthrough 模式：tea 的 system prompt 原样透传（不被网关 persona 替换）。
spring:
  # 2026-10-28 欠费治理：gateway profile 排除 dashscope embedding 自动配置。
  # 根因：主配置 application.yml 用 env 注入真实 AI_DASHSCOPE_API_KEY → DashScopeEmbeddingAutoConfiguration
  # 无条件装配 EmbeddingModel（spring.ai.model.embedding=none 挡不住 starter 的 bean 创建）→
  # 每次 culture/search 调 text-embedding-v3 → 账户欠费实测 400 Arrearage → 纯延迟 + 日志噪音 + 无收益。
  # 生产（非 gateway profile）不受影响，embedding 承重墙不变。
  autoconfigure:
    exclude:
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeEmbeddingAutoConfiguration
  ai:
    model:
      chat: openai
      # embedding 保持禁用（2026-10-28 复核）：DashScope 账户欠费（实测 400 Arrearage），
      # 装配 DashScopeEmbeddingModel 会让每次检索多一次失败的付费调用（延迟 + 无收益）；
      # B1 类目检索优化（teas.category 直查）不依赖 embedding。向量 RAG 待自托管 embedding 通道再恢复。
      embedding: none
    openai:
      # 根地址即可：Spring AI OpenAiApi 自动追加 /v1/chat/completions（带 /v1 会拼成 /v1/v1/ 404/连接失败）
      base-url: ${AI_GATEWAY_BASE_URL:http://127.0.0.1:7864}
      api-key: ${AI_GATEWAY_API_KEY:}
      chat:
        options:
          model: ${AI_GATEWAY_MODEL:cn:deepseek-v4.1-flash}
          # DeepSeek 系推理模型默认思考：thinking tokens 计入 max_tokens，过小会吞掉 content
          # （实测 1024 被推理吃光 → content 空 → 前端降级规则引擎；4096 起完整输出）
          max-tokens: 4096
          temperature: 0.7
