# 测试专用配置（2026-10-13 重建）：此前源文件被删、仅 target 残留旧产物（只含 ratelimit 段），
# 测试 classpath 优先加载 test-classes/application.yml 覆盖主配置 → tea.jwt 段丢失 → JWT bean 创建失败。
# 本文件 = 主配置镜像（spring 段 + tea 段启动必需键）+ 测试增强（jwt 测试密钥 / 放宽限流）。
# 维护：主配置新增启动必需段时同步到这里（测试环境不能只靠默认值）。
spring:
  application:
    name: tea-backend-test
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
      # B1.1：与主配置同步排除 DashScope embedding，测试环境同样要求 OnnxEmbeddingModel 为唯一 EmbeddingModel
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeEmbeddingAutoConfiguration
  ai:
    model:
      # 默认 ChatModel 固定 dashscope（@Primary），消除 openai starter 引入后的双 ChatModel 歧义
      chat: dashscope
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY:disabled}
      base-url: ${AI_DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com}
      # embedding 配置块保留为镜像主配置；DashScopeEmbeddingAutoConfiguration 已排除（见上），实际不生效
      embedding:
        options:
          model: ${AI_EMBEDDING_MODEL:text-embedding-v3}
    mcp:
      server:
        name: tea-mcp-server
        version: 1.0.0
        type: SYNC
        capabilities:
          tool: true
        sse-endpoint: /mcp
        sse-message-endpoint: /mcp/messages
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tea}
    username: ${DB_USER:tea}
    password: ${DB_PASSWORD:tea}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

tea:
  # 容错执行器：测试环境零退避（真实等待会让重试用例从毫秒级涨到数秒），
  # max-attempts 与生产一致保持 3，保证「重试次数」语义在测试里也是真的。
  ai:
    resilience:
      timeout-ms: 20000
      max-attempts: 3
      backoff-base-ms: 0
      backoff-multiplier: 2.0
      backoff-jitter-ratio: 0.2
      max-call-depth: 3
  jwt:
    # 测试固定密钥（≥32 字节，HS256 要求）；主配置 fail-closed 无兜底，测试环境必须显式提供
    secret: test-jwt-secret-0123456789abcdef
    expiration-minutes: 1440
  ratelimit:
    # 放宽：集成测试同 JVM 共享单例 RateLimitFilter，匿名 3/min 会把多次调用拦成 429
    ai-anon-max: 100000
    ai-anon-daily-max: 1000000
    ai-auth-max: 100000
    login-max: 100000
    # ADR-022 遥测上报面：集成测试多次 POST /batch，放宽避免被 429
    telemetry-anon-max: 100000
