# 可选观测栈：Prometheus + Grafana
#
# 为什么是独立 overlay 而不是塞进 docker-compose.yml：
#   站点能不能跑不依赖这两个容器。把它们作为默认服务，会把「监控挂了」变成「站点起不来」
#   ——可用性反而被监控拖累。用 -f 叠加启用，监控故障时可随时摘掉。
#
# 用法（在仓库根，与主 compose 叠加）：
#   docker compose -f docker-compose.yml -f deploy/observability/docker-compose.observability.yml up -d
#
# 网络：overlay 与主 compose 同属一个项目，自动共享默认网络；Prometheus 用服务名 backend:8080 直连容器，
# 不经过宿主机端口映射（backend 只绑 127.0.0.1，容器内到不了宿主回环）。Grafana 只绑本机 127.0.0.1:3000。

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    # 不需要 extra_hosts：抓取走同 compose 网络内的服务名 backend:8080。
    # 用 host-gateway 会解析到网桥网关（172.x.0.1），而 backend 只绑 127.0.0.1，连不上。
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:11.5.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # 只读看板：避免有人手改面板后与仓库版本漂移
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/tea-ai-production.json
    volumes:
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  promdata:
  grafanadata:
