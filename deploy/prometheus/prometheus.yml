# Prometheus 抓取配置（一盏茶生产）
#
# 为什么抓 backend:8080（compose 服务名）而不是宿主机回环：
#   backend 端口在 compose 里绑定为 127.0.0.1:18080 —— 只在宿主机 loopback 上，刻意不让公网访问。
#   但 Prometheus 跑在容器里，Linux 上 host.docker.internal:host-gateway 解析到的是**网桥网关**
#   （172.x.0.1），不是 127.0.0.1，连过去会 connection refused，target 恒 DOWN。
#   （Windows/macOS 的 Docker Desktop 例外：host.docker.internal 会转发到宿主机回环，所以本地能通。）
#   结论：生产走 compose 网络内的服务名 backend:8080，同网络内直达容器，不经过宿主机端口映射。
#   观测栈 overlay 与主 compose 属于同一个 compose 项目 → 自动共享同一网络，无需额外配置。

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    service: tea-ceremony
    env: production

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: tea-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['backend:8080']
        labels:
          instance: tea-backend

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
