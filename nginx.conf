# =============================================================
# 80 端口：只负责 ACME 挑战与强制跳转 HTTPS
#
# 为什么 80 不再 include app-locations.conf：
#   若 80 也服务站点，/api/、/assets/、SPA 路由就能在明文 HTTP 下继续使用 ——
#   TLS 形同虚设（HSTS 只在 443 下发，首次用 http:// 打开的用户没有任何保护）。
#   80 只留 ACME + 301 后，location 集合只有一份（app-locations.conf），
#   漂移源数量为 0，比「两个 server 各 include 一次」更彻底。
# =============================================================
server {
    listen 80;
    server_name localhost;

    # 不暴露 nginx 版本号（线上实测 Server: nginx/1.30.4）
    server_tokens off;

    # 日志
    access_log /var/log/nginx/tea-access.log;
    error_log /var/log/nginx/tea-error.log;

    # 上传大小限制
    client_max_body_size 10M;

    # ACME HTTP-01（证书签发/续期全靠它）
    #   ^~ 保证本 location 优先于任何正则 location；
    #   这里绝不能写 return 301 —— 把挑战请求也跳走，证书就永远续不了
    #   （Let's Encrypt 只走 80 端口的明文 HTTP-01，不跟随跳转时视为失败）。
    # 实际文件落在容器 /var/www/certbot/.well-known/acme-challenge/<token>，
    # 由 compose 挂载 ./certbot-www:/var/www/certbot 与 certbot 共享。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        access_log off;
    }

    # 其余请求（含浏览器直接敲裸 IP）一律跳 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# =============================================================
# 443 端口：真正的站点入口（HTTP/2 + TLS1.2/1.3）
#
# 证书前置条件：/etc/nginx/certs/fullchain.pem 与 privkey.pem 必须存在。
# 证书缺失时 nginx 会直接启动失败（emerg: cannot load certificate），
# 而不是降级成 HTTP —— 这是刻意的 fail-closed，启用顺序见 DEPLOY.md。
# =============================================================
server {
    listen 443 ssl;
    http2 on;

    # 裸 IP 证书：Host 头可能是 42.121.125.4，也可能是别的探测值。
    # 唯一的 443 server 本来就是默认 server，写 _ 明确表示「不靠 server_name 选虚拟主机」。
    server_name _;

    # 不暴露 nginx 版本号
    server_tokens off;

    # 日志
    access_log /var/log/nginx/tea-access.log;
    error_log /var/log/nginx/tea-error.log;

    # 上传大小限制
    client_max_body_size 10M;

    # ---- TLS ----
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # 只留 TLS1.2/1.3：1.0/1.1 已被主流浏览器弃用，且不支持 AEAD 套件
    ssl_protocols       TLSv1.2 TLSv1.3;
    # 全部为 ECDHE + AEAD（前向保密 + 抗 padding oracle）；TLS1.3 套件由 OpenSSL 固定，不受此列表影响。
    # ssl_prefer_server_ciphers off：让客户端（浏览器）优先选，端到端延迟更低且利于 ChaCha20 在移动端生效。
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    # 会话复用：10m 共享缓存约可存 4 万个会话，省一次完整握手（TLS1.2 有效；TLS1.3 主要靠 ticket）
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    # tickets off：ticket 密钥不轮换就等于长期 master secret 外泄面；客户端已有 session cache 兜底。
    # 单机 + 无 ticket 密钥轮换机制的场景，关掉比开着安全。
    ssl_session_tickets off;

    # OCSP stapling 关闭（默认也是 off，这里显式写出来锁定意图）：
    #   stapling 要求证书带 OCSP responder 且 nginx 能验证 OCSP 响应；
    #   Let's Encrypt 2025 起已停止 OCSP 服务，IP 证书（shortlived profile，6 天）
    #   与自签证书都没有可用的 OCSP 端点 —— 开着只会让 nginx 反复解析失败并打日志。
    ssl_stapling off;
    ssl_stapling_verify off;

    # ---- 安全头 ----
    # HSTS 只在 HTTPS 下发。这里写 server 级一份，覆盖「不带 add_header 的 location」
    # （/api/ 与探测路径 404 正则）；带 add_header 的 location 由
    # snippets/security-headers.conf 里那份接管（add_header 无部分继承）。
    # 不加 includeSubDomains：裸 IP 无子域。
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Gzip 压缩
    gzip on;
    gzip_types application/javascript text/css application/json application/manifest+json application/xml;
    gzip_min_length 256;
    gzip_comp_level 5;

    # Brotli 压缩（P2-10）：比 gzip 平均小 15~20%；需 nginx 镜像带 brotli 模块（见 nginx/Dockerfile）
    brotli on;
    brotli_types application/javascript text/css application/json application/manifest+json application/xml application/octet-stream;
    brotli_comp_level 6;
    brotli_min_length 256;

    # 代理超时
    proxy_connect_timeout 30s;
    proxy_read_timeout 30s;

    # 前端静态文件
    root /usr/share/nginx/html;
    index index.html;

    # 站点 location 段：唯一来源，80 与 443 不再各存一份
    include /etc/nginx/snippets/app-locations.conf;
}
