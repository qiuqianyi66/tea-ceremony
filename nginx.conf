server {
    listen 80;
    server_name localhost;

    # 不暴露 nginx 版本号（线上实测 Server: nginx/1.30.4）
    server_tokens off;

    # 日志
    access_log /var/log/nginx/tea-access.log;
    error_log /var/log/nginx/tea-error.log;

    # 上传大小限制
    client_max_body_size 10M;

    # Gzip 压缩
    gzip on;
    gzip_types application/javascript text/css application/json text/html application/manifest+json application/xml;
    gzip_min_length 256;
    gzip_comp_level 5;

    # Brotli 压缩（P2-10）：比 gzip 平均小 15~20%；需 nginx 镜像带 brotli 模块（见 nginx/Dockerfile）
    brotli on;
    brotli_types application/javascript text/css application/json text/html application/manifest+json application/xml application/octet-stream;
    brotli_comp_level 6;
    brotli_min_length 256;

    # 代理超时
    proxy_connect_timeout 30s;
    proxy_read_timeout 30s;

    # 前端静态文件
    root /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------------------
    # 机器人协议与站点地图：必须是真实文件（此前缺失 → 被 SPA fallback 回成
    # 200 + text/html，搜索引擎拿到一份不是 robots.txt 的 HTML）
    # ---------------------------------------------------------------
    location = /robots.txt {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        include /etc/nginx/snippets/security-headers.conf;
        types { application/xml xml; }
        default_type application/xml;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # PWA manifest：此前以 application/octet-stream 返回，部分浏览器拒绝解析
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/manifest+json;
        expires -1;
    }

    # 健康检查：后端 actuator 已 permitAll，直连暴露只为 GET /actuator/health
    # （show-details: when_authorized → 匿名只拿到 {"status":"UP"}，不泄露组件明细）
    location = /actuator/health {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # 源码/配置/备份类探测路径一律 404，不再回 SPA 壳
    location ~* ^/.*\.(env|sql|conf|yml|yaml|log|bak|pem|key|ini|sh|ps1)$ {
        return 404;
    }
    location ~* ^/\.(env|git|svn|hg|DS_Store) {
        return 404;
    }

    # 静态资源缓存（自带 add_header → 必须 include 安全头，否则资产响应无 nosniff）
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API 反向代理到后端（Spring Boot 8080）
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # P1-1：nginx 生成统一链路 id，透传后端（RequestIdFilter 沿用）；后端日志/响应头可串链路
        proxy_set_header X-Request-ID $request_id;

        # 安全头由后端独占：剥离上游同名头，避免 nginx 再拼一份变成 "DENY,DENY"
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-XSS-Protection;
    }

    # ---------------------------------------------------------------
    # 已知前端路由 → SPA 入口；其余路径返回真 404。
    # 白名单必须与 src/router/index.ts 的路由前缀一致：
    #   node scripts/verify-nginx-routes.cjs 会做双向核对（CI 门禁）
    # ---------------------------------------------------------------
    location ~ ^/(garden|synesthesia|break|select|brew|taste|tools|login|collection|ai|map|graph|tearoom|profile|tea|history|growth|share|health)(/|$) {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.html;
        # expires -1 自带 Cache-Control: no-cache：入口 HTML 不缓存，保证发版即时生效
        expires -1;
    }

    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.html;
        expires -1;
    }

    # 未匹配任何路由 → 404（不再把任意路径都回成 200 index.html）
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }
}

