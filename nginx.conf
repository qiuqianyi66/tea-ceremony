server {
    listen 80;
    server_name localhost;

    # 安全头部
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; worker-src 'self'" always;

    # 日志
    access_log /var/log/nginx/tea-access.log;
    error_log /var/log/nginx/tea-error.log;

    # 上传大小限制
    client_max_body_size 10M;

    # Gzip 压缩
    gzip on;
    gzip_types application/javascript text/css application/json text/html;
    gzip_min_length 256;
    gzip_comp_level 5;

    # Brotli 压缩（P2-10）：比 gzip 平均小 15~20%；需 nginx 镜像带 brotli 模块（见 nginx/Dockerfile）
    brotli on;
    brotli_types application/javascript text/css application/json text/html application/octet-stream;
    brotli_comp_level 6;
    brotli_min_length 256;

    # 代理超时
    proxy_connect_timeout 30s;
    proxy_read_timeout 30s;

    # 前端静态文件
    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由支持
    location / {
        try_files $uri /index.html;
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 静态资源缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API 反向代理到后端
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

