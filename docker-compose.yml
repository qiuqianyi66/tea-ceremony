services:
  # PostgreSQL 数据库（schema 完全由 Flyway 管理：V1 表 + V2 文化种子/向量检索）
  # ADR-013：pgvector/pgvector:pg16（同 PG16，含 vector + pg_trgm 扩展；数据卷兼容）
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tea_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-tea_ceremony}
    # 不暴露宿主端口：仅容器网络内部访问（生产安全）；如需宿主直连调试，
    # 取消下行注释映射（注意本机若装了原生 PostgreSQL 会占用 5432）
    # ports:
    #   - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # yg-gateway（WorkBuddy 积分 AI 网关，2026-10-13 Q1 部署接入）
  # 源码/config/auths 见 ./yg-gateway/（本地目录，不入 GitHub）；构建自 Dockerfile。
  # 仅 compose 网络内部访问（backend → http://yg-gateway:7864），不映射宿主端口。
  yg-gateway:
    build: ./yg-gateway
    restart: unless-stopped
    # 容器以 root 运行以便写入挂载的 auths/data（源码 Dockerfile 默认 app 用户）；
    # auths 属主不一致会拒绝写入（permission denied）。试用期容器，逃逸面可接受。
    user: "0:0"
    volumes:
      - ./yg-gateway/auths:/app/auths
      - ./yg-gateway/data:/app/data
      - ./yg-gateway/config.json:/app/config.json
    # 网关镜像自带 HEALTHCHECK，但它没有 /healthz 端点 → 探针恒失败 → 容器永远 unhealthy；
    # 一旦将来有任何服务写 depends_on: yg-gateway: service_healthy，就会永久卡在启动前。
    # 网关自身可用性由 backend 的 502 → 前端规则引擎降级链兜底（teaAI.ts 承重墙）。
    healthcheck:
      disable: true

  # Spring Boot 后端（Flyway 自动迁移 + Actuator 健康探针）
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      # 8080 本机常被占用，宿主机映射 18080。
      # 只绑 127.0.0.1：映射到 0.0.0.0 等于把 Spring Boot 直接暴露公网 ——
      # 绕过 nginx 的 TLS、CSP/X-Frame-Options/nosniff 与限流，是一条后门。
      # 容器间健康探针走 compose 网络（backend:8080），不受影响；
      # 宿主调试仍可 curl http://127.0.0.1:18080/actuator/health。
      - "127.0.0.1:18080:8080"
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://db:5432/tea_ceremony}
      DB_USER: ${DB_USER:-tea_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      # 管理端点令牌（/api/v1/admin/**）。application.yml 里默认值是**空** → AdminTokenFilter
      # fail-closed 就把所有管理端点打成 401。此前 compose 没传这一项，导致 .env 里配了也无效
      # （实测：启动灰度实验返回「管理端点未配置访问令牌」）。管理端点=实验启停与回填，
      # 没有它就只能等自动回滚、无法人工止血。
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      # 以下为运维调参口，默认值与 application.yml 完全一致（不传行为不变）：
      #   - 容错执行器：上游变慢时先调大 timeout-ms，别改业务逻辑（见 deploy/README.md「AI 延迟」）
      #   - 质量评分：默认关闭（LLM 判官有成本），需按周开一次拿数据
      AI_RESILIENCE_TIMEOUT_MS: ${AI_RESILIENCE_TIMEOUT_MS:-20000}
      AI_RESILIENCE_MAX_ATTEMPTS: ${AI_RESILIENCE_MAX_ATTEMPTS:-3}
      TEA_AI_QUALITY_ENABLED: ${TEA_AI_QUALITY_ENABLED:-false}
      TEA_AI_QUALITY_LLM_ENABLED: ${TEA_AI_QUALITY_LLM_ENABLED:-true}
      TEA_AI_QUALITY_BATCH_SIZE: ${TEA_AI_QUALITY_BATCH_SIZE:-20}
      # AI 通道 = yg-gateway（gateway profile，openai 兼容，DeepSeek 账号池）。
      # 2026-10-14 用户拍板：生产 AI 走 yg-gateway；API key 缺失时启动失败（预期安全行为）。
      # DashScope 主路径保留可切回：移除 SPRING_PROFILES_ACTIVE 与 AI_GATEWAY_* 即可（AI_DASHSCOPE_API_KEY 行保留无害）。
      # 网关不可用时后端 502 → 前端降级规则引擎（teaAI.ts 承重墙）。
      SPRING_PROFILES_ACTIVE: gateway
      AI_GATEWAY_BASE_URL: http://yg-gateway:7864
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:?AI_GATEWAY_API_KEY must be set}
      AI_GATEWAY_MODEL: ${AI_GATEWAY_MODEL:-cn:deepseek-v4.1-flash}
      AI_DASHSCOPE_API_KEY: ${AI_DASHSCOPE_API_KEY:-disabled}
      # B1.1 自托管 embedding：bge-large-zh-v1.5 ONNX（宿主机目录只读挂载进容器）。
      # 变量名须对齐 relaxed binding：TEA_EMBEDDING_ONNX_MODEL_PATH → tea.embedding.onnx.model-path。
      # 未设置/目录缺失时 OnnxEmbeddingConfig 不建 bean → 检索自动降级纯 ILIKE（承重墙不变）。
      TEA_EMBEDDING_ONNX_MODEL_PATH: ${TEA_EMBEDDING_ONNX_MODEL_PATH:-/models}
    volumes:
      # 模型文件在仓库外（禁提交）：宿主机 D:\models\bge-large-zh-v1.5-onnx → 容器 /models:ro
      - ${TEA_ONNX_MODEL_HOST_DIR:-D:\models\bge-large-zh-v1.5-onnx}:/models:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Actuator /actuator/health：容器存活探针，不依赖具体业务。
      # -Y off：禁 wget 代理（daemon 代理配置会注入容器 http_proxy，localhost 探测必须直连）
      test: ["CMD-SHELL", "wget -Y off -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Vue 前端（多阶段构建：node build -> nginx + brotli，产物自包含在镜像内）
  frontend:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # 配置与证书用 bind mount 而不是只靠镜像内副本：改 nginx.conf / 换证书只需重启容器，
    # 不必重新 vite build（前端产物仍在镜像里，挂载只覆盖 conf 与 snippets）。
    # certs 缺失或证书文件无效时 nginx 启动即失败 —— fail-closed，见 DEPLOY.md「HTTPS 启用顺序」。
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./certs:/etc/nginx/certs:ro
      # ACME HTTP-01 挑战文件：certbot 容器写，nginx 容器只读
      - ./certbot-www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
