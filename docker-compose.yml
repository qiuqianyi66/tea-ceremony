services:
  # PostgreSQL 数据库（schema 完全由 Flyway 管理：V1 表 + V2 文化种子）
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tea_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-tea_ceremony}
    # 不暴露宿主端口：仅容器网络内部访问（生产安全）；如需宿主直连调试，
    # 取消下行注释映射（注意本机若装了原生 PostgreSQL 会占用 5432）
    # ports:
    #   - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Spring Boot 后端（Flyway 自动迁移 + Actuator 健康探针）
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://db:5432/tea_ceremony}
      DB_USER: ${DB_USER:-tea_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Actuator /actuator/health：容器存活探针，不依赖具体业务。
      # -Y off：禁 wget 代理（daemon 代理配置会注入容器 http_proxy，localhost 探测必须直连）
      test: ["CMD-SHELL", "wget -Y off -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Vue 前端（多阶段构建：node build -> nginx + brotli，产物自包含在镜像内）
  frontend:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    # HTTPS 就绪后开放 443（证书挂载见 DEPLOY.md「HTTPS」章节）
    # - "443:443"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
