# ============================================================
# 「一盏茶」生产 nginx 配置（Windows 原生版）
# 对应 DEPLOY.md「Windows Server 原生部署」
#
# 用法：把本文件内容合并/复制到 nginx for Windows 的
#       <nginx-install>\conf\nginx.conf，或作为 conf.d 片段。
# 约定：项目根 = C:\tea，前端构建产物 = C:\tea\dist，
#       后端 uvicorn 监听 127.0.0.1:8000。
#       路径在 nginx 里一律用正斜杠（C:/tea/dist）。
#
# 与 Linux/容器版 nginx.conf 的差异：
#   - root 指向 Windows 本地 dist（不再是 /usr/share/nginx/html）
#   - proxy_pass 指向 127.0.0.1:8000（不再是容器服务名 backend）
#   - 日志写到 nginx 自己的 logs 目录（不再是 /var/log/nginx）
#   - brotli 注释掉：官方 nginx for Windows 不带 brotli 模块；
#     gzip 已开，单用户够用。需要 brotli 请换第三方带模块的 Windows 构建。
# ============================================================

server {
    listen 80;
    server_name _;

    # 安全头部
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; worker-src 'self'" always;

    # 日志（nginx for Windows 用相对路径，写到 nginx 安装目录的 logs\）
    access_log logs/tea-access.log;
    error_log logs/tea-error.log;

    # 上传大小限制
    client_max_body_size 10M;

    # Gzip 压缩
    gzip on;
    gzip_types application/javascript text/css application/json text/html;
    gzip_min_length 256;
    gzip_comp_level 5;

    # Brotli：官方 Windows 版 nginx 不带 brotli 模块，保持注释。
    # 如需启用，换带 ngx_brotli 的 Windows 构建（如第三方编译版），再取消注释。
    # brotli on;
    # brotli_types application/javascript text/css application/json text/html application/octet-stream;
    # brotli_comp_level 6;
    # brotli_min_length 256;

    # 代理超时
    proxy_connect_timeout 30s;
    proxy_read_timeout 30s;

    # 前端静态文件（npm run build 产物）
    root C:/tea/dist;
    index index.html;

    # SPA 路由支持
    location / {
        try_files $uri /index.html;
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 静态资源缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API 反向代理到本机 uvicorn
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

