name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run type-check
      - name: Production build
        run: npm run build-only
      - name: Start preview server
        run: npm run preview -- --host 127.0.0.1 > preview.log 2>&1 &
      - name: Smoke test routes
        run: sleep 3 && npm run smoke

  frontend-unit:
    name: Frontend unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test

  frontend-lint:
    name: Frontend lint (Biome)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Biome check
        run: npm run lint

  dependency-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: npm audit (high/critical)
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: pip install pip-audit==2.10.1
      # 已知残留（warn 不阻断）：pyasn1<0.5 受 python-jose 约束、ecdsa 无修复版本；
      # 根治需迁移 PyJWT（已记录，未立项）。新出现的高危仍应在日志中可见。
      - name: pip-audit (advisory, non-blocking)
        continue-on-error: true
        run: pip-audit -r backend/requirements.txt

  e2e:
    name: E2E full journey (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npm run test:e2e -- --grep-invert "axe 扫描"
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  e2e-a11y:
    name: E2E accessibility (axe-core)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run axe scans (0 critical/serious gate)
        run: npx playwright test --grep "axe 扫描"
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-a11y-report
          path: test-results/
          retention-days: 7

  backend:
    name: Backend syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: python -m compileall -q backend

  backend-test:
    name: Backend API tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock
      - name: Run API tests
        working-directory: backend
        run: python -m pytest tests -q

  backend-lint:
    name: Backend lint and security scan (ruff + bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock
      - name: ruff check
        working-directory: backend
        run: ruff check app main.py tests
      - name: bandit security scan
        working-directory: backend
        run: bandit -r app main.py

  backend-springboot:
    name: Backend Spring Boot tests (Maven + Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Maven tests
        working-directory: backend
        # 全量测试（单测 + 集成），Testcontainers 用 runner 自带 Docker 起 postgres:16
        run: mvn -q test

  migration-test:
    name: Database migration tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tea_test
          POSTGRES_PASSWORD: tea_test
          POSTGRES_DB: tea_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tea_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run migration and pool tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://tea_test:tea_test@localhost:5432/tea_test
        run: python -m pytest tests/test_migrations.py tests/test_pool_recycle.py -q

  compose-validate:
    name: Compose 校验（部署单元）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate docker-compose
        run: docker compose config --quiet
        env:
          # compose 必填变量（:? 保护生产）；CI 校验用占位值
          POSTGRES_PASSWORD: ci-test
          DB_PASSWORD: ci-test
          JWT_SECRET: ci-test-secret

  harness-consistency:
    name: Harness consistency（docs 漂移门禁）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # verify-harness.cjs 纯 fs 无依赖，不需 npm ci；期望输出 ERRORS: []
      - name: Run harness consistency check
        run: node scripts/verify-harness.cjs
      # red-line-auditor / consistency-verifier 的豆包机械化替代（红线 15 条可判定子集 + wiki 契约双向核对）
      - name: Run red-line audit
        run: node scripts/audit-redlines.cjs
      - name: Run wiki drift audit
        run: node scripts/audit-wiki-drift.cjs
      # eval-harness 门禁（G1/K5）：对最新切片跑七维评测，总分<60 退出码 1 阻断
      # O-5=扫描 .harness/changes/ 最新切片（按 mtime，排除 _template）；CI 不传 --verify（无前端依赖，正确性维记 0 分，语义见 AGENTS.md §11）
      - name: Run eval harness on latest slice
        run: |
          latest=$(ls -1dt .harness/changes/*/ | grep -v _template | head -1 | xargs -n1 basename)
          echo "eval slice: $latest"
          node scripts/eval-harness.cjs "$latest"
