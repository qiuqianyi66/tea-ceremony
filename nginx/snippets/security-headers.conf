# 安全响应头（单一来源）
#
# 为什么单独拆文件：nginx 的 add_header 只做「全有或全无」继承 ——
# 一旦某个 location 自己写了任意一条 add_header，server 级声明的全部 add_header 都会失效。
# 线上实测后果：location / 因为写了 add_header Cache-Control，导致 CSP / X-Frame-Options /
# nosniff / Referrer-Policy 在首页全部丢失（响应头里只剩 9 个缓存相关头）。
# 因此凡是自带 add_header 的 location，都必须显式 include 本文件。

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# 注意：/api/ 走代理时不 include 本文件，改由后端 Spring Security 独占，
# 否则 nginx 与后端各发一份，nginx 会拼成 "DENY,DENY" 这种非法值，浏览器直接丢弃。
add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; worker-src 'self'" always;
