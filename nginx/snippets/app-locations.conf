# 站点 location 段（单一来源，被 HTTPS server 块 include）
#
# 为什么抽成片段而不抄两份：150 行 location 手抄到 80/443 两个 server 里，
# 改一处忘另一处是必然事件；而 nginx 在 server 上下文 include location 是合法的，
# 所以「保留两处副本」防的不是漂移，而是制造漂移。
#
# 本文件只放 location 级指令与 include，不放 listen / ssl / root 等 server 级指令
# （server 级指令由各自的 server 块负责；80 只做 ACME + 301 跳转，不引用本文件）。

# ---------------------------------------------------------------
# 机器人协议与站点地图：必须是真实文件（此前缺失 → 被 SPA fallback 回成
# 200 + text/html，搜索引擎拿到一份不是 robots.txt 的 HTML）
# ---------------------------------------------------------------
location = /robots.txt {
    include /etc/nginx/snippets/security-headers.conf;
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
}

location = /sitemap.xml {
    include /etc/nginx/snippets/security-headers.conf;
    types { application/xml xml; }
    default_type application/xml;
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
}

# PWA manifest：此前以 application/octet-stream 返回，部分浏览器拒绝解析
location = /manifest.webmanifest {
    include /etc/nginx/snippets/security-headers.conf;
    default_type application/manifest+json;
    expires -1;
}

# 健康检查：后端 actuator 已 permitAll，直连暴露只为 GET /actuator/health
# （show-details: when_authorized → 匿名只拿到 {"status":"UP"}，不泄露组件明细）
location = /actuator/health {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    access_log off;
}

# 源码/配置/备份类探测路径一律 404，不再回 SPA 壳
location ~* ^/.*\.(env|sql|conf|yml|yaml|log|bak|pem|key|ini|sh|ps1)$ {
    return 404;
}
location ~* ^/\.(env|git|svn|hg|DS_Store) {
    return 404;
}

# 静态资源缓存（自带 add_header → 必须 include 安全头，否则资产响应无 nosniff）
location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# API 反向代理到后端（Spring Boot 8080）
location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # P1-1：nginx 生成统一链路 id，透传后端（RequestIdFilter 沿用）；后端日志/响应头可串链路
    proxy_set_header X-Request-ID $request_id;

    # 安全头由后端独占：剥离上游同名头，避免 nginx 再拼一份变成 "DENY,DENY"
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-XSS-Protection;
}

# ---------------------------------------------------------------
# MCP 端点（P1-1 试点）不对公网开放：显式 404。
#
# 背景：SecurityConfig 对 /mcp 与 /mcp/messages 是 permitAll，且 RateLimitFilter
# 的规则集不含 /mcp。其唯一工具 CultureSearchTool 走 CultureSearchService.search()，
# 会触发付费 embedding。一旦为放行 MCP 而新增 nginx location，就会形成
# 「无认证 + 无频控 → 付费调用」的成本放大通道。
#
# 此前该路径靠「SPA 白名单不含 mcp → 落到末尾 location / 的 404」隐式关闭。
# 隐式关闭的问题：白名单增删时看不出这里还有一扇门，后人加一行放行不会有任何提示。
# 本块把「关闭」变成显式决策——要开放必须先删掉这里，并同步补认证与限流。
#
# 用 ^~ 前缀匹配而非正则：优先于下面的 SPA 正则 location，且 /mcp/messages 一并覆盖。
location ^~ /mcp {
    return 404;
}

# ---------------------------------------------------------------
# 已知前端路由 → SPA 入口；其余路径返回真 404。
# 白名单必须与 src/router/index.ts 的路由前缀一致：
#   node scripts/verify-nginx-routes.cjs 会做双向核对（CI 门禁）
# ---------------------------------------------------------------
location ~ ^/(garden|synesthesia|break|select|brew|taste|tools|login|collection|ai|map|graph|tearoom|profile|tea|history|growth|share|health)(/|$) {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri /index.html;
    # expires -1 自带 Cache-Control: no-cache：入口 HTML 不缓存，保证发版即时生效
    expires -1;
}

location = / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri /index.html;
    expires -1;
}

# 未匹配任何路由 → 404（不再把任意路径都回成 200 index.html）
location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
}
